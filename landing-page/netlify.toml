[build]
  base = "landing-page"
  publish = "dist"

# SPA Redirect - all routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # RFC 8288 Link headers for agent discovery + the markdown alternate.
    # Inert while the site is on GitHub Pages (which emits its own fixed
    # header set); kept in sync with public/_headers and the <link> tags in
    # index.html — guarded by tests/link-headers.test.js.
    Link = '</.well-known/api-catalog>; rel="api-catalog"; type="application/linkset+json", </.well-known/openapi.json>; rel="service-desc"; type="application/vnd.oai.openapi+json", </llms.txt>; rel="service-doc"; type="text/plain", </.well-known/ai-catalog.json>; rel="describedby"; type="application/json", </index.md>; rel="alternate"; type="text/markdown"'
    Vary = "Accept"

# Cache Static Assets (1 year) - hashed filenames
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache Images (1 week)
[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Cache Fonts (1 year)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Context-Specific
[context.production]
  [context.production.environment]
    NODE_ENV = "production"
