<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusPaw - Limit Reached</title>
    <link rel="stylesheet" href="../common/theme.css" />
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <main class="container" role="main">
      <div class="bear" role="img" aria-label="Bear mascot">🐻</div>
      <h1 id="page-heading">Whoa there, friend!</h1>
      <p class="message" role="status" aria-live="polite">
        You've hit your <strong id="limit-type">daily</strong> limit for
        <strong id="domain-name">this site</strong>.
      </p>
      <p class="subtext" id="subtext">Maybe it's time for a breather? Your focus bear thinks so.</p>

      <div class="stats" role="region" aria-label="Visit statistics">
        <div class="stat-item">
          <span class="stat-label">Visits today:</span>
          <span class="stat-value tnum" id="visit-count">--</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Limit:</span>
          <span class="stat-value tnum" id="limit-value">--</span>
        </div>
      </div>

      <div class="countdown" role="region" aria-label="Time until limit reset" aria-live="polite">
        <p class="countdown-label">Time until you can access this site:</p>
        <div class="countdown-timer" id="countdown-timer">
          <span id="countdown-hours" class="countdown-unit tnum">00</span>
          <span class="countdown-separator">:</span>
          <span id="countdown-minutes" class="countdown-unit tnum">00</span>
          <span class="countdown-separator">:</span>
          <span id="countdown-seconds" class="countdown-unit tnum">00</span>
        </div>
        <p class="countdown-sublabel" id="countdown-sublabel">until midnight</p>
      </div>

      <div class="actions">
        <button id="back-btn" class="btn btn-primary">Back to work</button>
        <button
          id="settings-btn"
          class="btn btn-secondary"
          aria-label="Open settings to adjust limits"
        >
          Adjust limits
        </button>
      </div>

      <p class="footer" id="reset-footer">Reset happens at midnight. You got this!</p>
    </main>

    <script type="module" src="blocked.js"></script>
  </body>
</html>
