<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusPaw - Blocking Rules</title>
    <link rel="stylesheet" href="../common/theme.css" />
    <link rel="stylesheet" href="../common/shell.css" />
    <link rel="stylesheet" href="./blocking.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-brand">
        <span class="header-logo">
          <img src="../../assets/icon.svg" alt="FocusPaw logo" width="18" height="18" />
        </span>
        <h1 class="brand-name">
          FocusPaw
          <span class="header-crumb">Blocking rules</span>
        </h1>
      </div>
      <div class="header-actions">
        <a href="./index.html" class="pill-button pill-button-secondary">
          <svg class="icon" aria-hidden="true">
            <use href="../../assets/icons.svg#i-arrow-left"></use>
          </svg>
          Dashboard
        </a>
      </div>
    </header>

    <main class="page">
      <p class="eyebrow">Rules</p>
      <h1 class="page-title">Blocking rules</h1>
      <p class="page-lead">
        Set visit limits on distracting sites. FocusPaw blocks the site for the rest of the window
        once you hit the limit.
      </p>

      <section class="add-rule-card" aria-labelledby="add-rule-title">
        <h2 id="add-rule-title" class="card-title">Add a rule</h2>
        <form id="limit-form" class="rule-form" novalidate>
          <div class="form-field">
            <label for="limit-domain">Domain</label>
            <input
              type="text"
              id="limit-domain"
              name="domain"
              placeholder="example.com"
              autocomplete="off"
              required
            />
          </div>

          <label class="checkbox-group" for="limit-enabled">
            <input type="checkbox" id="limit-enabled" name="enabled" checked />
            <span>Enable blocking for this site</span>
          </label>

          <fieldset class="limit-fieldset">
            <legend>Limits</legend>
            <div class="limit-grid">
              <div class="limit-option">
                <label class="checkbox-group" for="five-hour-enabled">
                  <input type="checkbox" id="five-hour-enabled" name="fiveHourEnabled" checked />
                  <span>5-hour window</span>
                </label>
                <div class="limit-input-group">
                  <label for="five-hour-limit">Max visits per 5 hours</label>
                  <input
                    type="number"
                    id="five-hour-limit"
                    name="fiveHourLimit"
                    min="1"
                    value="10"
                  />
                </div>
              </div>
              <div class="limit-option">
                <label class="checkbox-group" for="daily-enabled">
                  <input type="checkbox" id="daily-enabled" name="dailyEnabled" checked />
                  <span>Daily limit</span>
                </label>
                <div class="limit-input-group">
                  <label for="daily-limit">Max visits per day</label>
                  <input type="number" id="daily-limit" name="dailyLimit" min="1" value="20" />
                </div>
              </div>
            </div>
          </fieldset>

          <p id="limit-error" class="form-error" role="alert"></p>

          <button type="submit" class="btn btn-primary save-btn">Save rule</button>
        </form>
      </section>

      <section aria-labelledby="rules-title">
        <h2 id="rules-title" class="rules-heading">
          Active rules
          <span id="rules-count" class="count-chip">0</span>
        </h2>
        <div id="rules-empty" class="empty-state">
          <svg class="empty-icon" aria-hidden="true">
            <use href="../../assets/icons.svg#i-shield"></use>
          </svg>
          <h3>No blocking rules yet</h3>
          <p class="empty-hint">Add your first rule above to start managing your focus.</p>
        </div>
        <div id="rules-list" class="rules-list"></div>
      </section>
    </main>

    <script type="module" src="blocking.js"></script>
  </body>
</html>
