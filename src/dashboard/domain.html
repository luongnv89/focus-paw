<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusPaw - Domain detail</title>
    <link rel="stylesheet" href="../common/theme.css" />
    <link rel="stylesheet" href="../common/shell.css" />
    <link rel="stylesheet" href="./domain.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-brand">
        <span class="header-logo">
          <img src="../../assets/icon.svg" alt="FocusPaw logo" width="18" height="18" />
        </span>
        <h1 class="brand-name">
          FocusPaw
          <span class="header-crumb">Domain</span>
        </h1>
      </div>
      <div class="header-actions">
        <button
          id="back-btn"
          class="pill-button pill-button-secondary"
          aria-label="Back to dashboard"
        >
          <svg class="icon" aria-hidden="true">
            <use href="../../assets/icons.svg#i-arrow-left"></use>
          </svg>
          Dashboard
        </button>
      </div>
    </header>

    <main class="page">
      <p class="eyebrow">Domain</p>
      <h1 id="domain-title" class="page-title">example.com</h1>

      <section class="domain-stats-grid" aria-label="Domain statistics">
        <div class="kpi">
          <div class="kpi-label eyebrow">Visits today</div>
          <div class="kpi-value tnum"><strong id="stat-today">0</strong></div>
        </div>
        <div class="kpi">
          <div class="kpi-label eyebrow">Last 7 days</div>
          <div class="kpi-value tnum"><strong id="stat-week">0</strong></div>
        </div>
        <div class="kpi">
          <div class="kpi-label eyebrow">Total visits</div>
          <div class="kpi-value tnum"><strong id="stat-total">0</strong></div>
        </div>
        <div class="kpi">
          <div class="kpi-label eyebrow">Last visit</div>
          <div class="kpi-value kpi-value-text"><strong id="stat-last-visit">—</strong></div>
        </div>
      </section>

      <section class="domain-limit-card">
        <div class="card-header">
          <h2>Limit configuration</h2>
          <p class="card-subtitle">
            Tweak or disable the per-site limits without leaving this view.
          </p>
        </div>

        <form id="domain-limit-form" class="settings-form">
          <label class="toggle-row" for="detail-limit-enabled">
            <div class="toggle-row-info">
              <span>Enable limits</span>
            </div>
            <input
              type="checkbox"
              id="detail-limit-enabled"
              name="enabled"
              class="toggle-input"
              checked
            />
          </label>

          <div id="detail-limit-config-section">
            <div class="limit-type-section">
              <label class="toggle-row" for="detail-five-hour-enabled">
                <div class="toggle-row-info">
                  <span>5-hour window limit</span>
                  <p class="muted-copy">Max visits in any rolling 5-hour period</p>
                </div>
                <input
                  type="checkbox"
                  id="detail-five-hour-enabled"
                  name="fiveHourEnabled"
                  class="toggle-input"
                  checked
                />
              </label>

              <div id="detail-five-hour-config" class="limit-input-group">
                <label for="detail-five-hour-limit">Visits per 5 hours</label>
                <input
                  id="detail-five-hour-limit"
                  name="fiveHourLimit"
                  type="number"
                  min="1"
                  step="1"
                  value="10"
                />
              </div>
            </div>

            <div class="limit-type-section">
              <label class="toggle-row" for="detail-daily-enabled">
                <div class="toggle-row-info">
                  <span>Daily limit</span>
                  <p class="muted-copy">Max visits per day</p>
                </div>
                <input
                  type="checkbox"
                  id="detail-daily-enabled"
                  name="dailyEnabled"
                  class="toggle-input"
                  checked
                />
              </label>

              <div id="detail-daily-config" class="limit-input-group">
                <label for="detail-daily-limit">Visits per day</label>
                <input
                  id="detail-daily-limit"
                  name="dailyLimit"
                  type="number"
                  min="1"
                  step="1"
                  value="20"
                />
              </div>
            </div>
          </div>

          <p id="domain-limit-error" class="form-error" role="alert"></p>
          <button type="submit" class="pill-button pill-button-primary save-limit-btn">
            Save limit
          </button>
        </form>
      </section>

      <section class="domain-history-card">
        <div class="history-header">
          <div>
            <h2>Recent activity</h2>
            <p class="card-subtitle">Last 7 sessions for this domain</p>
          </div>
          <button id="delete-domain-data" class="pill-button pill-button-danger">
            Delete domain data
          </button>
        </div>
        <ul id="history-list" class="history-list">
          <li class="history-empty">No activity yet.</li>
        </ul>
      </section>
    </main>

    <div id="domain-toast" class="settings-toast" aria-live="polite"></div>

    <script type="module" src="domain.js"></script>
  </body>
</html>
